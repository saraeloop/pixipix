name: Verify and publish Python package

on:
  pull_request:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Validate release tag against package version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/release.py validate-tag --tag "$RELEASE_TAG"

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests

      - name: Test
        run: uv run pytest

      - name: Build direct wheel and source distribution
        run: |
          uv build --wheel --no-sources --out-dir dist
          uv build --sdist --no-sources --out-dir dist

      - name: Inspect distribution metadata and contents
        run: uv run python scripts/release.py inspect-dist --dist-dir dist

      - name: Rebuild wheel from source distribution
        shell: bash
        run: |
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [[ ${#sdists[@]} -ne 1 ]]; then
            echo "expected exactly one source distribution, found ${#sdists[@]}" >&2
            exit 1
          fi
          uv build --wheel --no-sources --out-dir "$RUNNER_TEMP/wheel-from-sdist" "${sdists[0]}"

      - name: Verify byte-identical wheel reproducibility
        run: >-
          uv run python scripts/release.py compare-wheels
          --direct-dir dist
          --rebuilt-dir "$RUNNER_TEMP/wheel-from-sdist"

      - name: Smoke-test installed wheel
        run: uv run --isolated --no-project --with dist/*.whl scripts/smoke_distribution.py

      - name: Smoke-test installed source distribution
        run: >-
          uv run --isolated --no-project --with dist/*.tar.gz
          scripts/smoke_distribution.py

      - name: Upload verified distributions
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified distributions to PyPI
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pixipix/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Verify downloaded artifact shape
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          files=(dist/*)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 || ${#files[@]} -ne 2 ]]; then
            echo "expected one wheel and one sdist only; found ${#wheels[@]} wheel(s), ${#sdists[@]} sdist(s), ${#files[@]} total file(s)" >&2
            exit 1
          fi

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          skip-existing: false
