name: Verify and publish Python package

on:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to recover
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve immutable release source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      release_commit: ${{ steps.release.outputs.release_commit }}
      release_tag: ${{ steps.release.outputs.release_tag }}
      release_version: ${{ steps.release.outputs.release_version }}
      recovery: ${{ steps.release.outputs.recovery }}
    steps:
      - name: Check out workflow source and full tag history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release source
        id: release
        shell: bash
        env:
          RECOVERY_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail

          resolve_tag() {
            local release_tag="$1"
            if [[ ! "$release_tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)((a|b|rc)(0|[1-9][0-9]*))?$ ]]; then
              echo "release tag must match vMAJOR.MINOR.PATCH with an optional aN, bN, or rcN suffix" >&2
              exit 1
            fi
            release_ref="refs/tags/$release_tag"
            if ! git show-ref --verify --quiet "$release_ref"; then
              echo "release tag does not exist: $release_tag" >&2
              exit 1
            fi
            release_commit="$(git rev-parse "${release_ref}^{commit}")"
            git cat-file -e "${release_commit}^{commit}"
            git show "${release_commit}:pyproject.toml" > "$RUNNER_TEMP/release-pyproject.toml"
            python3 scripts/release.py validate-tag \
              --tag "$release_tag" \
              --project-file "$RUNNER_TEMP/release-pyproject.toml"
            release_version="${release_tag#v}"
          }

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              release_ref="$GITHUB_SHA"
              release_commit="$(git rev-parse "${GITHUB_SHA}^{commit}")"
              release_tag=""
              release_version=""
              recovery="false"
              ;;
            push)
              if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
                echo "publish workflow push events must be tags" >&2
                exit 1
              fi
              release_tag="$GITHUB_REF_NAME"
              resolve_tag "$release_tag"
              recovery="false"
              ;;
            workflow_dispatch)
              if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
                echo "release recovery must be dispatched from main" >&2
                exit 1
              fi
              release_tag="$RECOVERY_TAG"
              resolve_tag "$release_tag"
              if [[ "$release_tag" != "v0.1.1" || "$release_commit" != "5c2e5b794860523d1fde21350ddd8da5f173f442" ]]; then
                echo "recovery is authorized only for immutable release v0.1.1 at 5c2e5b794860523d1fde21350ddd8da5f173f442" >&2
                exit 1
              fi
              python3 scripts/release.py check-github-release --tag "$release_tag"
              recovery="true"
              ;;
            *)
              echo "unsupported workflow event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          {
            echo "release_ref=$release_ref"
            echo "release_commit=$release_commit"
            echo "release_tag=$release_tag"
            echo "release_version=$release_version"
            echo "recovery=$recovery"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build and verify distributions
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.release_commit }}

      - name: Verify immutable release source checkout
        shell: bash
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          set -euo pipefail
          head_commit="$(git rev-parse HEAD)"
          if [[ "$head_commit" != "$RELEASE_COMMIT" ]]; then
            echo "release checkout mismatch: expected $RELEASE_COMMIT, found $head_commit" >&2
            exit 1
          fi
          if [[ -n "$RELEASE_TAG" ]]; then
            tag_commit="$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
            if [[ "$head_commit" != "$tag_commit" ]]; then
              echo "release checkout does not match immutable tag $RELEASE_TAG" >&2
              exit 1
            fi
          fi
          echo "release source commit: $head_commit"

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Validate release tag against package version
        if: needs.resolve.outputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: uv run python scripts/release.py validate-tag --tag "$RELEASE_TAG"

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        if: needs.resolve.outputs.recovery != 'true'
        run: uv run mypy src tests

      - name: Type-check immutable recovery package source
        if: needs.resolve.outputs.recovery == 'true'
        # v0.1.1 predates the test-only Linux platform-guard fix; its tagged test source is immutable.
        run: uv run mypy src

      - name: Test portable suite
        run: >-
          uv run pytest
          --deselect=tests/parity/test_parity.py::test_current_behavior_matches_explicit_v0_1_1_authority
          --deselect=tests/parity/test_parity.py::test_active_release_gate_requires_the_canonical_runtime
          --deselect='tests/release/test_smoke_distribution.py::test_installed_artifact_matches_active_release_authority[direct_wheel]'
          --deselect='tests/release/test_smoke_distribution.py::test_installed_artifact_matches_active_release_authority[rebuilt_wheel]'

      - name: Build direct wheel and source distribution
        run: |
          uv build --wheel --no-sources --out-dir dist
          uv build --sdist --no-sources --out-dir dist

      - name: Inspect distribution metadata and contents
        run: uv run python scripts/release.py inspect-dist --dist-dir dist

      - name: Rebuild wheel from source distribution
        shell: bash
        run: |
          shopt -s nullglob
          sdists=(dist/*.tar.gz)
          if [[ ${#sdists[@]} -ne 1 ]]; then
            echo "expected exactly one source distribution, found ${#sdists[@]}" >&2
            exit 1
          fi
          uv build --wheel --no-sources --out-dir "$RUNNER_TEMP/wheel-from-sdist" "${sdists[0]}"

      - name: Verify byte-identical wheel reproducibility
        run: >-
          uv run python scripts/release.py compare-wheels
          --direct-dir dist
          --rebuilt-dir "$RUNNER_TEMP/wheel-from-sdist"

      - name: Smoke-test installed direct wheel
        run: uv run python scripts/smoke_distribution.py --artifact dist/*.whl

      - name: Smoke-test installed wheel rebuilt from source distribution
        run: >-
          uv run python scripts/smoke_distribution.py
          --artifact "$RUNNER_TEMP"/wheel-from-sdist/*.whl

      - name: Record publish candidate hashes
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.release_commit }}
          RELEASE_TAG: ${{ needs.resolve.outputs.release_tag }}
        run: |
          echo "release tag: $RELEASE_TAG"
          echo "release commit: $RELEASE_COMMIT"
          sha256sum dist/*.whl dist/*.tar.gz

      - name: Upload verified distributions
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: python-package-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  canonical:
    name: Verify canonical parity authority
    needs: build
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify recovery uses current main verification tooling
        if: needs.build.result == 'success' && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != "refs/heads/main" || "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]]; then
            echo "recovery verification tooling must come from the dispatched main commit" >&2
            exit 1
          fi

      - name: Download publish candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: ${{ runner.temp }}/release-candidate

      - name: Install uv and select canonical Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: "0.11.29"
          python-version: "3.12.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install canonical Python
        run: uv python install 3.12.12

      - name: Synchronize locked dependencies
        run: uv sync --locked --all-groups

      - name: Verify canonical runtime
        run: |
          uv run --no-sync python --version
          uname -m
          uv run --no-sync python -c 'import platform, sys; expected = ("3.12.12", "darwin", "arm64"); actual = (platform.python_version(), sys.platform, platform.machine().lower()); assert actual == expected, f"canonical runtime mismatch: expected={expected!r} actual={actual!r}"'

      - name: Verify publish candidate shape and hashes
        shell: bash
        run: |
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/release-candidate/*.whl)
          sdists=("$RUNNER_TEMP"/release-candidate/*.tar.gz)
          files=("$RUNNER_TEMP"/release-candidate/*)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 || ${#files[@]} -ne 2 ]]; then
            echo "expected one wheel and one sdist only; found ${#wheels[@]} wheel(s), ${#sdists[@]} sdist(s), ${#files[@]} total file(s)" >&2
            exit 1
          fi
          shasum -a 256 "${wheels[0]}" "${sdists[0]}"

      - name: Test canonical release authority
        env:
          PIXIPIX_RELEASE_CANDIDATE_DIR: ${{ runner.temp }}/release-candidate
        run: >-
          uv run pytest -q
          tests/parity/test_parity.py::test_current_behavior_matches_explicit_v0_1_1_authority
          tests/parity/test_parity.py::test_active_release_gate_requires_the_canonical_runtime
          'tests/release/test_smoke_distribution.py::test_installed_artifact_matches_active_release_authority[direct_wheel]'
          'tests/release/test_smoke_distribution.py::test_installed_artifact_matches_active_release_authority[rebuilt_wheel]'

  pypi-guard:
    name: Require release version to be absent from PyPI
    if: >-
      (github.event_name == 'push' &&
       github.ref_type == 'tag' &&
       startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       needs.resolve.outputs.recovery == 'true')
    needs: [resolve, canonical]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out current release verification tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Check PyPI release index
        env:
          RELEASE_VERSION: ${{ needs.resolve.outputs.release_version }}
        run: python3 scripts/release.py check-pypi-absence --version "$RELEASE_VERSION"

  publish:
    name: Publish verified distributions to PyPI
    if: >-
      (github.event_name == 'push' &&
       github.ref_type == 'tag' &&
       startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main' &&
       needs.resolve.outputs.recovery == 'true')
    needs: [resolve, canonical, pypi-guard]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pixipix/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist

      - name: Verify downloaded artifact shape
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          files=(dist/*)
          if [[ ${#wheels[@]} -ne 1 || ${#sdists[@]} -ne 1 || ${#files[@]} -ne 2 ]]; then
            echo "expected one wheel and one sdist only; found ${#wheels[@]} wheel(s), ${#sdists[@]} sdist(s), ${#files[@]} total file(s)" >&2
            exit 1
          fi
          sha256sum "${wheels[0]}" "${sdists[0]}"

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          packages-dir: dist/
          skip-existing: false
