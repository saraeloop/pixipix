[project]
name = "geometric-robot-fixture"
strict = true

[source]
format = "png"
expected_components = 2
max_width = 64
max_height = 64
max_pixels = 4096
max_components = 16

[background]
mode = "alpha"
alpha_threshold = 8

[extract]
connectivity = 8
minimum_area = 4
padding = 1
row_tolerance = 2

[frames]
names = ["idle", "signal"]

[scale]
mode = "explicit-factor"
factor = 1.0

[pixelize]
source_cell_size = 4
representative = "alpha-weighted-majority"
alpha_policy = "binary"
alpha_threshold = 128
remainder_policy = "pad-transparent"

[output]
frame_width = 4
frame_height = 4
anchor = "center"
clip_policy = "error"
